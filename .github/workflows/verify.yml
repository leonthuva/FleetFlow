name: Verify FleetFlow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fleetflow-review-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: security/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix security
      - run: npm ci --prefix supabase/tooling
      - run: npm install --global firebase-tools@15.30.1
      - run: firebase emulators:exec --only firestore --project demo-fleetflow "npm --prefix security test && npm --prefix supabase/tooling run test:firestore"

  proof-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/tooling/package-lock.json
      - run: npm ci --prefix supabase/tooling
      - run: npm --prefix supabase/tooling run check
      - run: npm --prefix supabase/tooling run test:backend
      - run: npm --prefix supabase/tooling run test:policies
      - run: node --test supabase/tests/provision.test.mjs
